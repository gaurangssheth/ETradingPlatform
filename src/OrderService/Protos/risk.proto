syntax = "proto3";

option csharp_namespace = "RiskService.Grpc";

package risk;

service Risk {
  rpc CheckOrderRisk (CheckOrderRiskRequest) returns (CheckOrderRiskResponse);
}

message CheckOrderRiskRequest {
  string orderId = 1;
  string clientId = 2;
  string symbol = 3;
  string side = 4;
  double quantity = 5;
  string orderType = 6;
}

message CheckOrderRiskResponse {
  bool approved = 1;
  string reasonCode = 2;
  string reason = 3;
  string riskDecisionId = 4;
}